- {iso: UK, lgd: 5,  name: Uttarakhand, type: state, capital: Dehradun, search_aliases: [Uttaranchal], geo_aliases: [Uttarakhand, Uttaranchal, Dehradun, Haridwar, Nainital, Rishikesh], gdelt_fips: [IN39]}
