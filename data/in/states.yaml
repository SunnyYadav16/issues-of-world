# data/in/states.yaml
# 36 states and union territories (IOW-009).
#   iso        ISO 3166-2:IN suffix (IN-MH -> MH)
#   lgd        Local Government Directory state code; equals State_LGD in the SoI tiles
#   gdelt_fips GDELT ADM1 codes that mean this state. Empty = GDELT has no code for it.
#   search_aliases  names a person may type in a search box ("Bengal", "Kashmir"); loose on purpose.
#   geo_aliases     place names (state, its cities, districts) that the headline matcher may trust (IOW-047, D-023):
#                   unambiguous only. Never add "Bengal" (Bay of Bengal), "Punjab" (Pakistani Punjab), "Kashmir"
#                   (Pakistan-administered part) or a bare "Aurangabad" (two states). No term may belong to two states.
# Sources: ISO codes per ISO 3166-2:IN after the 2023-11-23 change (OD, CG, TS, UK).
# gdelt_fips: GDELT's gazetteer predates 2019-2020, so it uses the legacy FIPS codes (Telangana and Ladakh have none;
# Wikipedia's current FIPS list has IN40/IN41/IN42 for Telangana/Ladakh/the merged DH, and none of those occurs in GDELT).
# Checked on 288 GKG files (2026-09-27 to 2026-09-29, ~40k Indian location mentions): IN06 seen 30 times, always
# "Dadra and Nagar Haveli" places. No Daman or Diu place and no IN32 occurred, so IN32 is NOT mapped: an unverified
# code could file another state's stories under DH. If GDELT ever emits IN32, the headline matcher still places
# "Daman" stories in DH through geo_aliases.
# IN29 (Sikkim) has not been seen in GDELT data yet either; it comes from FIPS 10-4 references.
- {iso: JK, lgd: 1,  name: Jammu and Kashmir, type: ut, capital: Srinagar / Jammu, search_aliases: [Kashmir, J&K], geo_aliases: [Jammu and Kashmir, Jammu & Kashmir, Srinagar, Jammu, Anantnag, Baramulla, Kupwara, Pulwama], gdelt_fips: [IN12]}
- {iso: HP, lgd: 2,  name: Himachal Pradesh, type: state, capital: Shimla, search_aliases: [], geo_aliases: [Himachal Pradesh, Himachal, Shimla, Manali, Dharamshala, Kullu], gdelt_fips: [IN11]}
- {iso: PB, lgd: 3,  name: Punjab, type: state, capital: Chandigarh, search_aliases: [], geo_aliases: [Ludhiana, Amritsar, Jalandhar, Patiala, Mohali, Bathinda], gdelt_fips: [IN23]}
