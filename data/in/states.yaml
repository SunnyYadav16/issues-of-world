# data/in/states.yaml
# 36 states and union territories (IOW-009).
#   iso        ISO 3166-2:IN suffix (IN-MH -> MH)
#   lgd        Local Government Directory state code; equals State_LGD in the SoI tiles
#   gdelt_fips GDELT ADM1 codes that mean this state. Empty = GDELT has no code for it.
#   search_aliases  names a person may type in a search box ("Bengal", "Kashmir"); loose on purpose.
#   geo_aliases     names safe for the automatic name-matching fallback (IOW-047); must be unambiguous.
#                   Empty for now. "Bengal" would catch Bay of Bengal, "Punjab" Pakistani Punjab, "Kashmir" the
#                   Pakistan-administered part, so none of those may ever be added here.
# Sources: ISO codes per ISO 3166-2:IN after the 2023-11-23 change (OD, CG, TS, UK).
# FIPS codes seen in 24 h of GDELT GKG (2026-09-28); IN05 confirmed in a 7-day GKG sample (84 files, 47k rows); IN29 (Sikkim) and IN32 (Daman and Diu, listed with
# IN06 for the merged UT) come from FIPS 10-4 references and have NOT been seen in GDELT data yet.
- {iso: JK, lgd: 1,  name: Jammu and Kashmir, type: ut, capital: Srinagar / Jammu, search_aliases: [Kashmir, J&K], gdelt_fips: [IN12]}
- {iso: HP, lgd: 2,  name: Himachal Pradesh, type: state, capital: Shimla, search_aliases: [], gdelt_fips: [IN11]}
