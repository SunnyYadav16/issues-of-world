# License registry (plan §7.3, IOW-011). The exporter takes display_policy from HERE, never from the plugin,
# so a plugin cannot loosen its own display rules by mistake. A source missing from this file is not exported,
# and neither is one with `active: false`.
#
# tier = who publishes it (1 official, 2 established outlet incl. independent media, 3 aggregator).
# genre = what kind of feed it is (top, world, business, technology, legal, governance), from news-scrap-test.
# Add a source: one entry here (plus a logo via scripts/fetch_logos.py). Remove: delete it, or set active: false to pause.
#
# active: true means a plugin exists AND the terms were read. Every active source must have every field set (tests enforce it).
# tos_checked_at is the day Claude read the page. It is not legal review. Fields left empty mean the page could not be
# fetched on 2026-10-02 (the fetch tool got HTTP 403, was blocked, or the guessed URL returned 404); read them by hand before activating.
- id: gdelt
  tier: 3
  license_id: gdelt-terms
  license_url: https://www.gdeltproject.org/about.html
  tos_url: https://www.gdeltproject.org/about.html
  tos_checked_at: 2026-10-02
  display_policy: headline_link
  attribution: GDELT Project
  # Terms: "unlimited and unrestricted use for any academic, commercial, or governmental use of any kind without fee";
  # any use or redistribution must cite the GDELT Project and link https://www.gdeltproject.org/.
  rate_limit: "none stated at https://www.gdeltproject.org/about.html"
  # The pipeline reads data.gdeltproject.org, whose /robots.txt returns 404 (no rules). The www host's robots.txt disallows /data/ for all agents.
  robots: "data.gdeltproject.org/robots.txt: 404, no rules; www.gdeltproject.org/robots.txt disallows /data/ for all agents; no AI/TDM bot rules"
  active: true

- id: pib
  tier: 1
  license_id: pib-terms
  display_policy: headline_link
  attribution: Press Information Bureau, Government of India
  # Copyright policy (Hindi page, read and translated by Claude): material on the site "may be reproduced free of charge and no prior permission is needed";
  # permission should come from the department or copyright holder; reproduce accurately and "prominently acknowledge" the source wherever it is published or issued to others.
  # The English version of the page was not retrieved (the 137_1 URL serves the same Hindi page). Terms of Use is only an accuracy and liability disclaimer; no clause on feeds or automated access.
  # The feed answers HTTP 403 to an honest bot User-Agent and 200 to a browser one (tested 2026-10-02 and 2026-10-03).
  license_url: https://www.pib.gov.in/content/137_2_CopyrightPolicy.aspx
  tos_url: https://www.pib.gov.in/content/138_2_TermsofUse.aspx
  tos_checked_at: 2026-10-03
  rate_limit: "none stated at https://www.pib.gov.in/content/138_2_TermsofUse.aspx"
  robots: "https://pib.gov.in/robots.txt returns an error page (\"The Page you have requested is not available\"), so no robots rules are published"
  active: false
  genre: governance
  feed_url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"
  homepage_url: "https://pib.gov.in"
  logo_url: "https://pib.gov.in/WriteReadData/userfiles/image/pib_logo.png"
  # logo: none; logo_url returned no image on 2026-10-03
  selectors: ["#form1 table", ".content-area", "#MainContent"]

