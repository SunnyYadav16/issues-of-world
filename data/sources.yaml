  rate_limit: "1000 calls per day, 1000 entries per call (https://apidoc.reliefweb.int/)"
  license_url: https://apidoc.reliefweb.int/
  robots: "n/a: reached through the API (api.reliefweb.int), not crawled; reliefweb.int/robots.txt is behind a bot challenge"
