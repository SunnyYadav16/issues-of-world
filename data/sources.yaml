  attribution: ReliefWeb (UN OCHA)
  # API docs: anyone can use the API, no fees; respect the intellectual property rights of the original source (content may be copyrighted by it);
  # a pre-approved appname is required (IOW-006 done). reliefweb.int/terms-conditions and /robots.txt returned HTTP 403.
  rate_limit: "1000 calls per day, 1000 entries per call (https://apidoc.reliefweb.int/)"
  active: false

- id: google-factcheck
  tier: 1
  license_id: google-apis-terms
  license_url: https://developers.google.com/terms/
  tos_url: https://developers.google.com/terms/
  tos_checked_at: 2026-10-02
  display_policy: headline_link
  attribution: Google Fact Check Tools (ClaimReview)
  # Google APIs ToS (last modified 2021-11-09), section 5e "Prohibitions on Content": "Unless expressly permitted by the content owner or by applicable law,
  # you will not ... Scrape, build databases, or otherwise create permanent copies of such content, or keep cached copies longer than permitted by the cache header;
  # Copy, translate, modify, create a derivative work of, sell, lease, lend, convey, distribute, publicly display, or sublicense to any third party".
  # This pipeline stores items and publishes static JSON, so read this clause before activating. Required attributions must also be shown.
  rate_limit: "none stated at https://developers.google.com/fact-check/tools/api"
  robots: "n/a: reached through the API, not crawled"
  active: false

