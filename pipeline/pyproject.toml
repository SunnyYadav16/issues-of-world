[project]
name = "iow"
version = "0.0.1"
description = "issues-of-world pipeline"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
iow = "iow.cli:main"

[project.entry-points."iow.sources"]
gdelt = "iow.plugins.sources.gdelt:GdeltSource"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["iow", "tests"]
extraPaths = ["tests"]
